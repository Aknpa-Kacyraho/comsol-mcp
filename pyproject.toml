[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comsol-mcp"
version = "0.3.0"
description = "MCP server that drives COMSOL Multiphysics through its Java API (via MPh), with a live COMSOL Desktop sharing the same session."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kacyraho" }]
keywords = ["comsol", "mcp", "multiphysics", "simulation", "automation", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "mph>=1.4",
    "mcp>=2",
    "pillow>=10",
    "numpy>=1.26",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
comsol-mcp = "comsol_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Aknpa-Kacyraho/comsol-mcp"

[tool.hatch.build.targets.wheel]
packages = ["comsol_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# COMSOL 的 Java API 会抛出各种运行时异常（FlException 等），
# 在工具边界统一兜底是有意为之，因此不强制 BLE001。
ignore = ["BLE001", "S110", "S112"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
